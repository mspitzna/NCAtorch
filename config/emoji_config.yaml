SEED: 42
DEVICE: "cuda"

# ---------------------------------------------------------------------------
# LOGGING — run identity, W&B and logging/checkpoint intervals
# ---------------------------------------------------------------------------
LOGGING:
  WANDB: true
  PROJECT_NAME: "emoji"
  TRAIN_NAME: "emoji_3x3"
  LOG_INTERVAL: 500
  SAVE_INTERVAL: 25000
  INTERMEDIATE_LOGGING_STEPS: [5, 20, 35]  # Steps at which intermediate states are logged (must be < ITER_N_MIN)

MODEL:
  NAME: "MLP"                         # Update model architecture: MLP or ResNet
  HIDDEN_CHANNELS: [80]               # Hidden layer sizes in the update model
  CHANNEL_N: 16                       # Number of CA state channels per cell
  USE_POSITIONAL_EMBEDDINGS: False    # Append learnable (x, y) coordinate channels to state
  LIVING_MASK: true                   # Zero out updates for cells below the alive threshold
  CLAMP_OUTPUT: true                  # Clamp state values to [-1, 1] after each step
  FINAL_ACTIVATION: true              # Apply Tanh to the update model output
  PERCEPTIONS:
    - MODE: "conv"            # Neighbourhood operator: conv, attention, mh_attention, sobel
      KERNEL_SIZE: 3
      OUT_CHANNEL: 80                 # Output channels from this perception branch

TRAINING:
  BATCH_SIZE: 10
  STEPS: 100000
  LOSS_FN: "mse"                      # Reconstruction loss: mse, l1, lpips, vggstyle, p_ce, i_ce, overflow
  LEARNING_RATE: 0.0005
  LR_SCHEDULE_MODE: "cosine"          # LR schedule: step, cosine, constant
  OPTIMIZER_BETAS: [0.5, 0.95]
  WARMUP_STEPS: 1000                  # Linear LR warm-up duration
  OVERFLOW_LOSS: true                 # Add overflow penalty to the loss
  OVERFLOW_WEIGHT: 1.0
  ITER_N_MIN: 38                      # Minimum CA rollout steps per batch
  ITER_N_MAX: 46                      # Maximum CA rollout steps per batch (sampled uniformly)
  GRADIENT_CLIPPING_NORM: 1.0         # Max gradient norm; 0 to disable
  GRADIENT_CHECKPOINTING: false        # Trade compute for memory via activation checkpointing
  GRADIENT_CHECKPOINT_SEGMENTS: 10
  GRADIENT_ACCUMULATION_STEPS: 1
  MIXED_PRECISION: true               # Enable automatic mixed precision (AMP)

DATASET:
  NAME: "emoji"                       # Dataset name: emoji, e2h, mnist, cifar10
  TARGET_SIZE: 40                     # Spatial resolution of the target image
  TARGET_PADDING: 18                  # Zero-padding added around the target
  NUM_WORKERS: 4
  EMOJIS:
    - "😀"
    - "🦎"
    - "🕸"
    - "🐠"
    - "🦋"
    - "🎄"

PATTERN_POOL:
  ENABLED: true                       # Use a persistent sample pool across steps
  POOL_SIZE: 256                      # Number of states stored in the pool
  POOL_DELAY: 1                       # Steps before pool sampling begins
  POOL_START_RATIO: 0.5               # Fraction of each batch drawn from the pool
  POOL_END_RATIO: 0.5
  POOL_DMG_RATIO: 0.5                 # Fraction of pool samples that are damaged before use
  POOL_DMG_DELAY: 1                   # Steps before damage is applied
  POOL_MUTATION_RATIO: 0.5            # Fraction of pool samples that are mutated
