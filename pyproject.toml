[project]
name = "ncatorch"
version = "0.1.0"
description = "Neural Cellular Automata framework in PyTorch"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "imageio[ffmpeg]>=2.35,<3",
    "lpips>=0.1.4",
    "matplotlib>=3.10,<4",
    "numpy>=2.0,<3",
    "opencv-python>=4.10,<5",
    "pandas>=2.0,<3",
    "pillow>=10.0,<12",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "tqdm>=4.0,<5",
    "requests>=2.32,<3",
    "wandb>=0.19",
    "fastapi[standard]>=0.124,<1",
    "uvicorn[standard]>=0.30,<1",
    "torch>=2.9,<3",
    "torchvision>=0.20",
    "datasets>=3.0",
    "plotly>=6.7.0",
    "pytest>=8.4.2",
]

[project.scripts]
ncatorch-train    = "scripts.train_ca:main"
ncatorch-train-ae = "scripts.train_ae:main"
ncatorch-ui       = "scripts.start_ui:main"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nca", "scripts"]

[tool.uv]
torch-backend = "cu130"
