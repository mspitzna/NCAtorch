PROJECT_NAME: "ot_ziggzagged"                 # Name of the project
TRAIN_NAME: "ot_ziggzagged_3x3"              # Name of the training run
SEED: 41                                  # Random seed
DEVICE: "cuda"                             # Device to use for training
WANDB: false                               # Flag to enable logging to Weights & Biases

MODEL:
  NAME: "ConvCA"
  HIDDEN_CHANNELS: [80]
  CHANNEL_N: 16
  LIVING_MASK: false
  CLAMP_OUTPUT: true
  PERCEPTIONS:
    - MODE: "conv"
      KERNEL_SIZE: 3
      OUT_CHANNEL: 80
    - MODE: "deformable_conv"
      KERNEL_SIZE: 3
      OUT_CHANNEL: 80


TRAINING:
  BATCH_SIZE: 12
  STEPS: 50000
  LEARNING_RATE: 0.0005
  LR_SCHEDULE_MODE: "cosine"
  LOSS_FN: "vggstyle"
  WARMUP_STEPS: 10000
  OVERFLOW_LOSS: true
  GAMMA: 0.1
  LOG_INTERVAL: 500
  SAVE_INTERVAL: 50000
  ITER_N_MIN: 12
  ITER_N_MAX: 22
  MIXED_PRECISION: true
  INTERMEDIATE_LOGGING_STEPS: [5, 10]
  GRADIENT_CLIPPING_NORM: 1.0
  GRADIENT_CHECKPOINTING: false
  GRADIENT_CHECKPOINT_SEGMENTS: 10
  GRADIENT_ACCUMULATION_STEPS: 1

DATASET:
  NAME: "ot"                           
  DATASET_SAMPLE_PATH: "./datasets/dtd-r1.0.1/dtd/images/zigzagged/zigzagged_0031.jpg" # mandatory for 'ot' dataset
  TARGET_SIZE: 98

PATTERN_POOL:
  ENABLED: true
  POOL_SIZE: 256
  POOL_DELAY: 1
  POOL_START_RATIO: 0.5
  POOL_END_RATIO: 0.5
  POOL_DMG_RATIO: 0.5
  POOL_DMG_DELAY: 1
  POOL_MUTATION_RATIO: 0.5
