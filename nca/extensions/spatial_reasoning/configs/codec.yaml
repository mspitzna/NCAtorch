# Spatial reasoning — MNIST Sudoku codec (paper App. A.4).
# Encoder and decoder are trained separately; run once per MODE:
#   python -m nca.extensions.spatial_reasoning.scripts.train_codec --config <this file> -o EXTENSIONS.SPATIAL_REASONING.CODEC.MODE=encoder
#   python -m nca.extensions.spatial_reasoning.scripts.train_codec --config <this file> -o EXTENSIONS.SPATIAL_REASONING.CODEC.MODE=decoder
# Requires the frozen digit classifier at CODEC.CLASSIFIER_PATH
# (python -m nca.extensions.spatial_reasoning.scripts.train_digit_classifier).

SEED: 42
DEVICE: "cuda"

LOGGING:
  WANDB: false
  PROJECT_NAME: "spatial_reasoning_codec"
  TRAIN_NAME: "sudoku_codec"

DATASET:
  NAME: "sudoku"
  NUM_WORKERS: 4
  DROP_LAST_BATCH: true

EXTENSIONS:
  SPATIAL_REASONING:
    SUDOKU:
      DIFFICULTY: [0.01, 0.81]
      TRAIN_SAMPLES: 100000
    CODEC:
      MODE: "decoder"            # "encoder" | "decoder"
      CELL_SIZE: 28
      CLASSIFIER_PATH: "checkpoints/mnist_cnn.pt"
      BATCH_SIZE: 32
      STEPS: 100000
      LEARNING_RATE: 0.001       # AdamW, linear warmup then cosine decay
      WEIGHT_DECAY: 0.00001
      WARMUP_STEPS: 1000
      LOG_INTERVAL: 1000
      SAVE_INTERVAL: 10000
      SOLUTION_RATIO: 0.5        # Decoder: share of samples rendered from the full solution
      ENCODER_BASE_CHANNELS: 32
      ENCODER_HIDDEN_DIM: 128
      DECODER_BASE_CHANNELS: 64
      DECODER_HIDDEN_DIM: 128
      DECODER_STYLE_DIM: 8       # Per-cell style latent of the conditional VAE
      KL_WEIGHT: 0.001
      PIXEL_L1_WEIGHT: 1.0
      FEATURE_L1_WEIGHT: 0.5
      CLASSIFIER_CE_WEIGHT: 1.0
      TV_WEIGHT: 0.01
      INK_WEIGHT: 0.0025
      BINARY_WEIGHT: 0.01
